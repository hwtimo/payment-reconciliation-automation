[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "remittance-reconciler"
version = "0.1.0"
description = "Deterministic insurance EFT remittance reconciliation with guarded, auditable payment posting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lxml",
    "pyyaml",
    "playwright",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
